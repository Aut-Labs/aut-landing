user  nginx;
worker_processes  auto;               # scale to CPU cores
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;          # adjust if you expect many simultaneous connections
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Global gzip settings for compressible responses
    gzip on;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_proxied any;

    # Define a cache zone for static assets
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

    # Map for WebSocket (or HTTP upgrade) connections
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}